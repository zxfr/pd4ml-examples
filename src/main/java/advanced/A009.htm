<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Invoice template</title>
<style>
  body { font-family: sans-serif; font-size: 11pt; }
  table.items { border-collapse: collapse; width: 100%; margin-top: 10px; }
  table.items th, table.items td { border-bottom: 1px solid #ccd; padding: 4px 6px; text-align: left; }
  .draft-only { color: red; font-weight: bold; }
  .total { text-align: right; font-size: 13pt; margin-top: 10px; }
</style>
</head>
<body>
<img class="logo" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxMjAnIGhlaWdodD0nMzAnPjxyZWN0IHdpZHRoPScxMjAnIGhlaWdodD0nMzAnIHJ4PSc0JyBmaWxsPScjNDU3YjlkJy8+PC9zdmc+">
<p class="draft-only">DRAFT - not for sending</p>
<h1>Invoice <span id="number">0000</span></h1>
<p>Date: <span id="date">yyyy-mm-dd</span><br>Customer: <span id="customer">Customer name</span></p>
<table class="items">
  <thead><tr><th>Item</th><th>Quantity</th><th>Amount</th></tr></thead>
  <tbody>
    <tr><td>Sample item</td><td>1</td><td>0.00</td></tr>
    <tr><td>Sample item</td><td>2</td><td>0.00</td></tr>
  </tbody>
</table>
<p class="total">Total: <b id="total">0.00</b> EUR</p>
</body>
</html>
